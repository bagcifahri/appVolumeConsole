# Builds the add-on when a version tag (for example v1.0.0) is pushed
# and attaches the .nvda-addon file to a GitHub release.
# The release download link is what goes into the NVDA Add-on Store registration form.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the manifest version
        run: |
          version=$(grep -E '^version\s*=' addon/manifest.ini | sed -E 's/^version\s*=\s*//; s/"//g; s/\s*$//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - run: python build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
